<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Inscrição</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
  <!-- 2.1 Cabeçalho e título/textos da página (Maria) -->
  <header class="form-header">
    <h1>Formulário de inscrição</h1>
    <p class="form-subtitle">
      Preencha os dados abaixo para fazer sua inscrição no programa Trilhas.
    </p>
  </header>

    <form id="formulario" novalidate>
      <h2 class="section-title">Informações do participante</h2>

      <!-- 2.2 Campos de dados pessoais (Maria) -->
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Maria Silva">
      </div>

      <div class="campo">
        <label for="data-nascimento">Data de nascimento</label>
        <input type="date" id="data-nascimento" name="data-nascimento">
        
      <!-- 2.3 Campos de contato e demais campos do Figma (Maria) -->
         <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="nome@email.com">

      <!-- 2.5 Abaixo de cada campo validado, um span de erro (ver "Combinado" no README) (Maria) -->
        
      <!-- 2.4 Botões "Cancelar" e "Realizar inscrição" (Maria) -->
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
